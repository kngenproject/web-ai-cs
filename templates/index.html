<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS AI - Toko Buah ABS Kepanjen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 480px; background: #ffffff; display: flex; flex-direction: column; height: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .chat-header { background: #2e7d32; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .clear-btn { background: #c62828; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; white-space: pre-line; }
        .user-msg { background: #e8f5e9; color: #1b5e20; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #f1f3f4; color: #202124; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input { display: flex; padding: 12px; border-top: 1px solid #e0e0e0; background: #fff; }
        .chat-input input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; }
        .chat-input button { margin-left: 8px; background: #2e7d32; color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span>🥭 CS ABS Kepanjen</span>
            <button class="clear-btn" onclick="clearChat()">Hapus Chat</button>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Ketik pertanyaan di sini..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        let chatHistory = JSON.parse(localStorage.getItem('abs_chat_history')) || [];

        window.onload = function() {
            if (chatHistory.length === 0) {
                appendMessage('bot', 'Halo Kak! 😊 Ada yang bisa kami bantu seputar stok buah, parcel, lokasi, atau loker di Toko Buah ABS Kepanjen?');
            } else {
                chatHistory.forEach(msg => appendToUI(msg.role === 'user' ? 'user' : 'bot', msg.content));
            }
        };

        function appendToUI(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'bot-msg'}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(sender, text) {
            appendToUI(sender, text);
            chatHistory.push({ role: sender === 'user' ? 'user' : 'assistant', content: text });
            // Simpan maksimal 10 pesan terakhir di localStorage browser
            if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);
            localStorage.setItem('abs_chat_history', JSON.stringify(chatHistory));
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.strip ? input.value.strip() : input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory.slice(0, -1) })
                });

                const data = await response.json();
                appendMessage('bot', data.response || 'Maaf Kak, terjadi kendala pada sistem.');
            } catch (err) {
                appendMessage('bot', 'Maaf Kak, koneksi sedang terganggu.');
            }
        }

        function clearChat() {
            if (confirm('Hapus seluruh riwayat percakapan?')) {
                localStorage.removeItem('abs_chat_history');
                chatHistory = [];
                document.getElementById('chatBox').innerHTML = '';
                appendMessage('bot', 'Halo Kak! 😊 Ada yang bisa kami bantu seputar stok buah, parcel, lokasi, atau loker di Toko Buah ABS Kepanjen?');
            }
        }
    </script>
</body>
</html>
