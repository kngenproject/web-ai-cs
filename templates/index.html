<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Assistant - {{ store_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #F1F5F9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .chat-container { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; background: #FFFFFF; display: flex; flex-direction: column; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        @media (min-width: 481px) { .chat-container { height: 90vh; border-radius: 20px; overflow: hidden; border: 1px solid #E2E8F0; } }
        
        /* Header */
        .chat-header { background: #059669; color: #FFFFFF; padding: 16px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 10px rgba(5, 150, 105, 0.15); z-index: 10; }
        .avatar-box { width: 42px; height: 42px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .header-info h1 { font-size: 16px; font-weight: 700; line-height: 1.2; }
        .header-info .status { font-size: 12px; color: #A7F3D0; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .status-dot { width: 8px; height: 8px; background: #34D399; border-radius: 50%; box-shadow: 0 0 8px #34D399; }
        
        /* Chat Area */
        .chat-box { flex: 1; padding: 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background-color: #F8FAFC; scroll-behavior: smooth; }
        .message-group { display: flex; flex-direction: column; max-width: 82%; animation: fadeIn 0.25s ease-out; }
        .message-group.user { align-self: flex-end; align-items: flex-end; }
        .message-group.bot { align-self: flex-start; align-items: flex-start; }
        
        .message { padding: 12px 16px; border-radius: 18px; font-size: 14.5px; line-height: 1.5; color: #1E293B; word-break: break-word; }
        .user .message { background: #059669; color: #FFFFFF; border-bottom-right-radius: 4px; box-shadow: 0 3px 10px rgba(5, 150, 105, 0.2); }
        .bot .message { background: #FFFFFF; color: #334155; border-bottom-left-radius: 4px; border: 1px solid #E2E8F0; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02); }
        
        .time-stamp { font-size: 10px; color: #94A3B8; margin-top: 4px; padding: 0 4px; }
        
        /* Typing Indicator */
        .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 12px 16px; background: #FFFFFF; border-radius: 18px; border-bottom-left-radius: 4px; border: 1px solid #E2E8F0; }
        .dot { width: 6px; height: 6px; background: #94A3B8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* Input Area */
        .input-area { padding: 12px 16px; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: flex; align-items: center; gap: 10px; }
        .input-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
        .input-wrapper input { width: 100%; padding: 12px 16px; background: #F1F5F9; border: 1px solid #E2E8F0; border-radius: 24px; font-size: 15px; color: #0F172A; outline: none; transition: all 0.2s ease; }
        .input-wrapper input:focus { border-color: #059669; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); }
        
        .send-btn { width: 44px; height: 44px; background: #059669; color: #FFFFFF; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s ease, background 0.2s ease; flex-shrink: 0; box-shadow: 0 3px 10px rgba(5, 150, 105, 0.25); }
        .send-btn:active { transform: scale(0.92); background: #047857; }
        .send-btn svg { width: 20px; height: 20px; fill: currentColor; margin-left: 2px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar-box">🥭</div>
        <div class="header-info">
            <h1>{{ store_name }}</h1>
            <div class="status"><span class="status-dot"></span> Siap Membantu</div>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message-group bot">
            <div class="message">Halo! Ada yang bisa kami bantu mengenai buah segar atau parcel hari ini? 😊</div>
            <div class="time-stamp" id="initTime"></div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Ketik pertanyaan kamu..." autocomplete="off" onkeypress="handleKeyPress(event)">
        </div>
        <button class="send-btn" onclick="sendMessage()" aria-label="Kirim Pesan">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
    document.getElementById("initTime").innerText = getCurrentTime();

    function getCurrentTime() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const message = input.value.trim();
        if (!message) return;

        appendMessage(message, "user");
        input.value = "";

        const chatBox = document.getElementById("chatBox");
        
        // Render Loading Indicator
        const loadingGroup = document.createElement("div");
        loadingGroup.className = "message-group bot";
        loadingGroup.id = "loadingIndicator";
        loadingGroup.innerHTML = `
            <div class="typing-indicator">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        `;
        chatBox.appendChild(loadingGroup);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });
            const data = await res.json();
            
            const loader = document.getElementById("loadingIndicator");
            if (loader) chatBox.removeChild(loader);

            if (data.reply) {
                appendMessage(data.reply, "bot");
            } else {
                appendMessage("Maaf, sedang ada kendala koneksi.", "bot");
            }
        } catch (err) {
            const loader = document.getElementById("loadingIndicator");
            if (loader) chatBox.removeChild(loader);
            appendMessage("Gagal terhubung ke server.", "bot");
        }
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById("chatBox");
        const group = document.createElement("div");
        group.className = `message-group ${sender}`;
        
        group.innerHTML = `
            <div class="message">${escapeHtml(text)}</div>
            <div class="time-stamp">${getCurrentTime()}</div>
        `;
        
        chatBox.appendChild(group);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(string) {
        return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function handleKeyPress(e) {
        if (e.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
