<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Pengaturan AI CS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #F8FAFC; color: #1E293B; padding-bottom: 90px; }
        
        /* Header */
        .admin-header { background: #059669; color: #FFFFFF; padding: 18px 20px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 10px rgba(5, 150, 105, 0.15); }
        .admin-header h1 { font-size: 18px; font-weight: 700; }
        .admin-header p { font-size: 12px; color: #A7F3D0; margin-top: 2px; }

        /* Container */
        .container { padding: 16px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        
        /* Form Card */
        .card { background: #FFFFFF; padding: 18px; border-radius: 16px; border: 1px solid #E2E8F0; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02); }
        .card-title { font-size: 14px; font-weight: 700; color: #059669; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        
        label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 6px; }
        input[type="text"], textarea { width: 100%; padding: 12px 14px; background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; color: #0F172A; outline: none; transition: all 0.2s ease; }
        input[type="text"]:focus, textarea:focus { border-color: #059669; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); }
        textarea { height: 160px; resize: vertical; line-height: 1.5; }

        /* Floating Action Button (FAB) */
        .fab-button { position: fixed; bottom: 20px; right: 20px; background: #059669; color: #FFFFFF; border: none; padding: 14px 24px; border-radius: 30px; font-size: 15px; font-weight: 600; box-shadow: 0 8px 20px rgba(5, 150, 105, 0.35); display: flex; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.1s ease, background 0.2s ease; z-index: 20; }
        .fab-button:active { transform: scale(0.95); background: #047857; }
        
        /* Toast Notification */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #0F172A; color: #FFFFFF; padding: 12px 20px; border-radius: 24px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 30; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="admin-header">
    <h1>Panel Pengaturan AI CS</h1>
    <p>Atur identitas & pengetahuan toko secara langsung</p>
</div>

<div class="container">
    <div class="card">
        <div class="card-title">🏷️ Identitas Toko</div>
        <label for="storeName">Nama Toko / Bisnis</label>
        <input type="text" id="storeName" value="{{ data.store_name }}" placeholder="Contoh: Toko Buah ABS">
    </div>

    <div class="card">
        <div class="card-title">🤖 Karakter & Peran AI</div>
        <label for="systemInstruction">System Prompt (Gaya Bahasa)</label>
        <textarea id="systemInstruction" placeholder="Atur gaya bahasa CS di sini...">{{ data.system_instruction }}</textarea>
    </div>

    <div class="card">
        <div class="card-title">📚 Pengetahuan Toko (SOP & FAQ)</div>
        <label for="businessInfo">Detail Produk, Harga, Jam Buka & Lokasi</label>
        <textarea id="businessInfo" style="height: 220px;" placeholder="Masukkan detail informasi toko...">{{ data.business_info }}</textarea>
    </div>
</div>

<!-- Floating Save Button -->
<button class="fab-button" onclick="saveChanges()">
    <span>💾</span> Simpan Perubahan
</button>

<!-- Toast Alert -->
<div id="toast" class="toast">Konteks berhasil diperbarui!</div>

<script>
    async function saveChanges() {
        const payload = {
            store_name: document.getElementById("storeName").value,
            system_instruction: document.getElementById("systemInstruction").value,
            business_info: document.getElementById("businessInfo").value
        };

        try {
            const res = await fetch("/api/save-context", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                showToast("Konteks berhasil diperbarui!");
            } else {
                showToast("Gagal menyimpan perubahan.");
            }
        } catch (e) {
            showToast("Kesalahan jaringan.");
        }
    }

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
    }
</script>

</body>
</html>
